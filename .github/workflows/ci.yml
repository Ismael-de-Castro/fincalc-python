name: FinCalc CI/CD Pipeline

on:
  push:
    branches: [ "main" ]

jobs:
  # JOB 1: INTEGRAÇÃO CONTÍNUA (CI) Roda nos servidores em nuvem do GitHub
  build-and-lint:
    name: Build Verification & Static Analysis
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do Código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar Ferramentas de Análise Estática
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Validar Sintaxe (Compilação Nativa)
        run: python -m py_compile fincalc.py

      - name: Executar Linter de Estilo e Boas Práticas (Flake8)
        run: flake8 fincalc.py

      - name: Executar Linter de Segurança (Bandit)
        run: bandit -r fincalc.py

  # JOB 2: ENTREGA CONTÍNUA (CD DESAFIO) Roda no próprio Codespaces do Aluno!
  deploy-simulado-codespaces:
    name: CD Deploy Simulado no Codespaces
    runs-on: self-hosted
    needs: build-and-lint
    steps:
      - name: Checkout do Código
        uses: actions/checkout@v4

      - name: Simular Implantação no Servidor de Produção do Codespace
        run: |
          echo "Iniciando processo de deploy automático no servidor local..."
          mkdir -p /tmp/servidor_producao_fincalc
          cp -r *.py /tmp/servidor_producao_fincalc/
          echo "Arquivos da aplicação copiados para /tmp/servidor_producao_fincalc/"
          python3 -m py_compile /tmp/servidor_producao_fincalc/fincalc.py
          echo "DEPLOY CONCLUÍDO COM SUCESSO!"
          echo "A aplicação FinCalc está 'no ar' e pronta para execução em produção."